name: Evidence secret scan

# Detection only, kept as a backstop. .no-mistakes.yaml no longer publishes
# test evidence (test.evidence.store_in_repo is false), but the orphan
# no-mistakes/evidence branch keeps what was published before, and a later
# re-enable would publish again. That branch has no workflows of its own, so a
# push to it cannot trigger a check and nothing here can stop a publish. This
# daily run scans what the branch gained in the last two days through
# bin/fm-evidence-branch-scan.sh, and goes red so the owner is told. A finding
# is a real secret until proven otherwise: docs/secret-scan.md owns what to do.
# A repository without that branch passes with a notice.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-evidence
  cancel-in-progress: false

jobs:
  evidence-scan:
    name: Evidence branch secret scan
    runs-on: ubuntu-24.04
    # Fast tier, as in ci.yml: one gitleaks run over two days of commits.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          set -eu
          bin/fm-install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret and URL scan of the last two days of evidence
        run: bin/fm-evidence-branch-scan.sh
