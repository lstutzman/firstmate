name: Evidence secret scan

# Detection only. no-mistakes publishes each run's test evidence to the orphan
# no-mistakes/evidence branch, which has no workflows of its own, so a push to
# it cannot trigger a check and nothing here can stop a publish. This daily run
# scans what that branch gained in the last two days with the same scan CI
# runs on code branches (bin/fm-secret-scan.sh, .gitleaks.toml) plus the
# evidence URL check (bin/fm-evidence-secrets.sh), and goes red so the owner is
# told. A finding is a real secret until proven otherwise: docs/secret-scan.md
# owns what to do. A repository without that branch skips with a notice.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-evidence
  cancel-in-progress: false

jobs:
  evidence-scan:
    name: Evidence branch secret scan
    runs-on: ubuntu-24.04
    # Fast tier, as in ci.yml: one gitleaks run over two days of commits.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find the evidence branch
        id: branch
        run: |
          set -eu
          if git rev-parse --verify --quiet refs/remotes/origin/no-mistakes/evidence >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No no-mistakes/evidence branch in this repository; nothing to scan."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned gitleaks
        if: steps.branch.outputs.present == 'true'
        run: |
          set -eu
          bin/fm-install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan of the last two days of evidence
        if: steps.branch.outputs.present == 'true'
        run: bin/fm-secret-scan.sh --range "--since=2.days.ago origin/no-mistakes/evidence"
      - name: URL query secrets in the files those commits touched
        if: steps.branch.outputs.present == 'true'
        run: |
          set -eu
          git worktree add --detach "$RUNNER_TEMP/evidence" origin/no-mistakes/evidence
          git log --since=2.days.ago --name-only --diff-filter=AM --format= origin/no-mistakes/evidence \
            | sort -u | while IFS= read -r f; do
                if [ -f "$RUNNER_TEMP/evidence/$f" ]; then printf '%s\0' "$RUNNER_TEMP/evidence/$f"; fi
              done > "$RUNNER_TEMP/evidence-files"
          if [ -s "$RUNNER_TEMP/evidence-files" ]; then
            xargs -0 bin/fm-evidence-secrets.sh check < "$RUNNER_TEMP/evidence-files"
          else
            echo "No evidence files changed in the last two days."
          fi
