# Secret scan configuration for this repository (gitleaks, version pinned in
# bin/fm-secret-scan.sh). bin/fm-secret-scan.sh owns how the scan is run: CI,
# the per-task pre-push hook and the no-mistakes lint step all call it, and
# docs/secret-scan.md owns the policy. This file holds only the reviewed
# allowlist; every entry names the exact false positive it covers.
#
# Baseline: the 2026-11-11 scan of all 3,355 commits found 68 generic-api-key
# matches. Each of the 67 reviewed false positives is covered by the narrow
# entries below, and one real token is listed separately at the end.
# A new finding fails the scan; do not widen an entry to make a new finding
# pass, review it first (a real secret is rotated, never allowlisted).

title = "firstmate secret scan"

[extend]
useDefault = true

# Decision keys. Firstmate writes a decision or blocker key as key=<slug>
# (also "key": "<slug>" in JSON). A slug is all lowercase letters and digits in
# at least two hyphen-separated segments, the first of letters only, so
# merge-handoff-9 and pending-reply-62eee41e2c466098 pass. A real key does not
# read that way: provider keys carry uppercase letters, underscores or no
# hyphen, so they still fail. The match is anchored to the key context.
[[allowlists]]
description = "firstmate decision key (key=<lowercase-slug>)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(?:^|[\s"'])key(?:=|"\s*:\s*")[a-z][a-z0-9]*(?:-[a-z0-9]+)+["' ]?$''',
]

# Decision keys whose slug is not all lowercase or that follow a free-text
# prefix. Each regex is the whole slug of one family and is anchored.
[[allowlists]]
description = "firstmate decision-key families outside the lowercase slug shape"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^PC-\d+-[0-9a-f]{12}$''',
  '''^bytes=\d+$''',
]

# Test canaries. Each is a fake value a test plants to prove it is never
# printed or put on argv. The allowlist needs both the exact value and the
# test file that plants it, so the same string anywhere else still fails.
[[allowlists]]
description = "canary: tests/fm-officer-progress.test.sh fixture token"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/fm-officer-progress\.test\.sh$''']
regexes = ['''^FIXTURESECRET0123456789abcdefghijklmnopqrstuv$''']

[[allowlists]]
description = "canaries: tests/fm-dispatch-resolve.test.sh never-on-argv values"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/fm-dispatch-resolve\.test\.sh$''']
regexes = ['''^(?:kc-effective-c07e5a12|test-key-9f1c2d3e)-never-on-argv$''']

[[allowlists]]
description = "canary: tests/fm-backend-t3code.test.sh inherited-secret value"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^tests/fm-backend-t3code\.test\.sh$''']
regexes = ['''^fm-inherited-secret-7f3a$''']

# NOT a false positive. Commit 4d572468 (2026-09-20, an upstream evidence
# commit on the no-mistakes/evidence branch) holds a Lavish board URL with an
# artifact_load_token query parameter in this one file. History is not
# rewritten, so the finding is allowlisted by commit and path only, which keeps
# CI from failing on old history while the same file in any other commit, and
# any other file in this commit, still fails. Whether the token still works was
# not checked; docs/secret-scan.md records that it is the captain's call.
# Do not add an entry like this for a new finding.
[[allowlists]]
description = "known real token in old history: Lavish board URL, commit 4d572468, one evidence file"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["4d572468c20199c54eba9236591d09603183306e"]
paths = ['''^\.no-mistakes/evidence/fm/fm-crew-hosted-lavish-shipB-r1/browser-after-round1\.txt$''']
